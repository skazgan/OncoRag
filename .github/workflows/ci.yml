name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev,llm]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest --cov=oncorag --cov-report=term-missing:skip-covered

      # End-to-end smoke test of the real CLI on the bundled synthetic corpus (offline).
      - name: CLI smoke test
        run: |
          oncorag demo --index-dir "$RUNNER_TEMP/idx"
          oncorag ask "Which drugs inhibit KRAS G12C in lung cancer?" --index-dir "$RUNNER_TEMP/idx"
          oncorag eval --index-dir "$RUNNER_TEMP/idx" --out-dir "$RUNNER_TEMP/reports"
