[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncorag"
version = "0.1.0"
description = "Evidence-grounded RAG over PubMed cancer-genomics literature: hybrid retrieval, reranking, cited answers, citation verification and an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "bioinformatics", "oncology", "llm", "pubmed", "qdrant"]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "qdrant-client>=1.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Hosted LLM generation (Anthropic API)
llm = ["anthropic>=0.40"]
# Local neural embeddings + cross-encoder reranker
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/skazgan/OncoRag"
Issues = "https://github.com/skazgan/OncoRag/issues"

[project.scripts]
oncorag = "oncorag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oncorag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
